<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Random Movie Picker</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="styles.css">
	<script src="picker.js" defer></script>
</head>

<body>
	<main>
		<header>
			<p class="eyebrow">Taylor University Library</p>
			<h1>Find a Movie</h1>
			<p class="intro">Search available DVDs in Zondervan Library through PALNI.</p>
		</header>

		<form id="movie-picker">
			<fieldset>
				<legend>Select movie type</legend>

				<div class="movie-types">
					<input type="radio" id="all" name="movie-type" value="all" checked />
					<label for="all">All DVDs</label>

					<input type="radio" id="fiction" name="movie-type" value="fiction" />
					<label for="fiction">Fiction</label>

					<input type="radio" id="non-fiction" name="movie-type" value="non-fiction" />
					<label for="non-fiction">Non-fiction</label>
				</div>
			</fieldset>

			<label for="movie-search">Title or keyword <span>(optional)</span></label>
			<input id="movie-search" name="movie-search" type="search" placeholder="e.g. Pride and Prejudice" />

			<button id="pick-movie" type="button">Search PALNI</button>
		</form>

		<section id="results" aria-live="polite">
			<p id="search-description"></p>
			<a id="catalog-link" hidden target="_blank" rel="noopener">View available DVDs in the PALNI catalog</a>
		</section>
	</main>
</body>

</html>
